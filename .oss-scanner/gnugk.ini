[Gatekeeper::Main]
Name=GnuGk
ExternalIP=STUN
; set external IP of the docker container explicitely in the lab
;ExternalIP=192.168.1.189
STUNServer=stun.ekiga.net
TimeToLive=120
CompareAliasType=0
CompareAliasCase=0
TraceLevel=5
EnableIPv6=0
StatusEventBacklog=100

[RoutedMode]
GKRouted=1
H245Routed=1
AcceptUnregisteredCalls=1
EnableH46017=0
EnableH46018=1
H245PortRange=20000-20100
SupportCallingNATedEndpoints=1
SupportNATedEndpoints=1

[RasSrv::RRQFeatures]
OverwriteEPOnSameAddress=1

[RoutingPolicy]
default=explicit,internal,srv,dns,neighbor

[GkStatus::Auth]
rule=explicit
127.0.0.1=allow
default=forbid

[Proxy]
Enable=1
ProxyAlways=1
RTPMultiplexing=0
RTPPortRange=30000-30500

