name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      PTLIBDIR: ${{ github.workspace }}/../ptlib
      OPENH323DIR: ${{ github.workspace }}/../h323plus

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    # the runner's apt mirrors are sometimes out of sync (package index names a version that was already
    # removed from the pool after a security update), so refresh the index and retry
    - name: Install dependencies
      run: |
        packages="g++ pkg-config automake make flex bison \
          libssl-dev libmysqlclient-dev libsqlite3-dev libpq-dev unixodbc-dev liblua5.3-dev libgeoip-dev \
          libcurl4-openssl-dev libsnmp-dev firebird-dev librabbitmq-dev libhiredis-dev libmosquitto-dev \
          nlohmann-json3-dev libssh-dev"
        for attempt in 1 2 3; do
          if sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $packages; then
            exit 0
          fi
          echo "::warning::apt-get failed (attempt $attempt of 3), retrying in 30 s"
          sleep 30
        done
        exit 1

    # built before CodeQL is initialized, so only GnuGk itself is analyzed
    - name: Build PTLib and H323Plus
      run: |
        git clone --depth 1 https://github.com/willamowius/ptlib "$PTLIBDIR"
        cd "$PTLIBDIR"
        ./configure --enable-ipv6 --disable-odbc --disable-sdl --disable-lua --disable-expat
        make -j"$(nproc)" optnoshared
        git clone --depth 1 https://github.com/willamowius/h323plus "$OPENH323DIR"
        cd "$OPENH323DIR"
        ./configure --enable-h235 --enable-h46017 --enable-h46026 --enable-h46019m
        make -j"$(nproc)" optnoshared

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual

    - name: Build GnuGk
      run: |
        ./configure --enable-h46018 --enable-large-fdset
        make -j"$(nproc)" optnoshared

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"
